# nginx config for the frontend container.
# - Serves the built SPA from /usr/share/nginx/html.
# - Proxies /api, /semaphore and /webhook to the backend FastAPI service
#   (compose service name "server") which handles auth + upstream proxying.
# - SPA fallback: any unknown path returns index.html.
# NOTE: the upstream host is the Compose-managed container name
# `freeshow-server` (project `freeshow` + service `server`). Docker DNS
# resolves it on the shared jdp-network, so the frontend can proxy to the
# receiver without publishing any extra host ports.
upstream sms_backend {
    server freeshow-server:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API + reverse-proxy passthroughs -> backend FastAPI.
    # proxy_pass without a URI preserves the full path (e.g. /api/variables).
    location /api/ {
        proxy_pass http://sms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /semaphore { proxy_pass http://sms_backend; proxy_set_header Host $host; }
    location /semaphore/ { proxy_pass http://sms_backend; proxy_set_header Host $host; }
    location = /webhook { proxy_pass http://sms_backend; proxy_set_header Host $host; }
    location /webhook/ { proxy_pass http://sms_backend; proxy_set_header Host $host; }

    # Built JS/CSS chunks.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
}
